<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>录音台</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --panel2: #faf9f7; --line: #e7e4de; --text: #1d1f23; --muted: #6d6a65;
  --faint: #a19d96; --accent: #3b5bdb; --accent-soft: #e8edff; --rex: #d9480f; --rex-soft: #fff0e6;
  --ok: #2b8a3e; --ok-soft: #e6f4ea; --warn: #b8860b; --warn-soft: #fff6db; --bad: #c92a2a; --bad-soft: #ffe8e8;
  --mark: #fff3bf; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181b; --panel: #1f2125; --panel2: #24262b; --line: #33363c; --text: #e8e6e3; --muted: #a29e98;
    --faint: #6f6b66; --accent: #8ea4ff; --accent-soft: #263055; --rex: #ff8a4c; --rex-soft: #3a2518;
    --ok: #69db7c; --ok-soft: #1d3324; --warn: #ffd43b; --warn-soft: #3a3214; --bad: #ff8787; --bad-soft: #3d1f1f;
    --mark: #4a4019; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif; }
button { white-space: nowrap; font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 11px; }
button:hover { border-color: var(--faint); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
button.ghost:hover { color: var(--text); background: var(--panel2); }
input, textarea { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }

/* ---------- 顶栏 */
header { flex: none; min-height: 56px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 9px 18px; border-bottom: 1px solid var(--line); background: var(--panel); position: relative; z-index: 2; }
header h1 { font-size: 17px; margin: 0 6px 0 0; letter-spacing: .5px; white-space: nowrap; }
.recbar { display: flex; align-items: center; gap: 6px; }
.recbtn { display: inline-flex; align-items: center; gap: 6px; }
.recbtn::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--rex); }
.recbar.on .recbtn { display: none; }
.recnow { display: none; align-items: center; gap: 8px; color: var(--rex); background: var(--rex-soft); border-radius: 999px; padding: 4px 6px 4px 12px; font-variant-numeric: tabular-nums; }
.recbar.on .recnow { display: inline-flex; }
.recnow .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--rex); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.recnow button { border-color: var(--rex); color: var(--rex); background: transparent; padding: 3px 10px; }
.recbtn.main { border-color: var(--rex); font-weight: 600; }
.recbar.busy .recbtn { opacity: .5; pointer-events: none; }
#meters { display: inline-flex; gap: 10px; color: var(--text); font-size: 12px; }
.meter { display: inline-flex; align-items: center; gap: 5px; }
.meter .bar { width: 46px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--ok); transition: width .3s; }
.meter.quiet { color: var(--muted); }
.meter.bad { color: var(--bad); font-weight: 600; }
.meter.bad .bar i { background: var(--bad); }
.search { margin-left: auto; width: min(320px, 30vw); }
.login { font-size: 12px; color: var(--muted); white-space: nowrap; }
.login.no { color: var(--bad); }

/* ---------- 两栏 */
main { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px 1fr; }
aside { border-right: 1px solid var(--line); background: var(--panel2); display: flex; flex-direction: column; min-height: 0; }
.drop { margin: 12px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 12px; text-align: center; color: var(--muted); font-size: 13px; }
.drop b { color: var(--text); font-weight: 600; }
.list { overflow-y: auto; flex: 1; padding: 0 8px 12px; }
.group { font-size: 12px; color: var(--faint); margin: 14px 8px 6px; }
.item { padding: 9px 10px; border-radius: 10px; cursor: pointer; margin-bottom: 2px; border: 1px solid transparent; }
.item:hover { background: var(--panel); }
.item.sel { background: var(--panel); border-color: var(--line); box-shadow: var(--shadow); }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .m { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; align-items: center; }
.hit { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
.hit .ts { display: inline; margin-right: 6px; line-height: 1.5; }
.chip { font-size: 11px; padding: 0 7px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.chip.busy { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }
.side-sec { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 13px; }
.side-sec summary { cursor: pointer; color: var(--muted); }
#phone { max-height: 32vh; overflow-y: auto; margin-top: 6px; }   /* 展开了也别把上面的录音列表挤没 */
.phone-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.phone-row:last-child { border-bottom: 0; }
.phone-row .pt { flex: 1; min-width: 0; }
.phone-row .pt div:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.phone-row .pt div:last-child { font-size: 12px; color: var(--muted); }
.jobs { max-height: 34vh; overflow-y: auto; }
.job { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.job:last-child { border-bottom: 0; }
.job .h { display: flex; gap: 6px; align-items: center; }
.job pre { margin: 4px 0 0; font: 11px/1.45 ui-monospace, Menlo, monospace; color: var(--muted); white-space: pre-wrap; word-break: break-all; max-height: 8.5em; overflow: hidden; }

/* ---------- 右边 */
section.detail { overflow-y: auto; min-height: 0; }
.empty { color: var(--muted); padding: 80px 40px; text-align: center; line-height: 2; }
.empty kbd { font: 12px ui-monospace, Menlo, monospace; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.dhead { position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); z-index: 1; padding: 18px 28px 0; border-bottom: 1px solid var(--line); }
.dtitle { display: flex; align-items: flex-start; gap: 10px; }
.dtitle h2 { margin: 0; font-size: 20px; line-height: 1.35; flex: 1; }
.dmeta { color: var(--muted); font-size: 13px; margin: 4px 0 10px; }
audio { width: 100%; height: 36px; }
.tracks { font-size: 12px; color: var(--muted); margin-top: 4px; }
.tabs { display: flex; gap: 2px; margin-top: 10px; }
.tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: 8px 14px; color: var(--muted); }
.tab.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tab .n { font-size: 11px; background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 0 6px; margin-left: 4px; }
.pane { padding: 18px 28px 80px; max-width: 980px; }
.notice { background: var(--warn-soft); color: var(--text); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; }
.notice.info { background: var(--accent-soft); }

/* 稿子 */
.line { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 5px 8px; border-radius: 8px; }
.line:hover { background: var(--panel); }
.line.now { background: var(--accent-soft); }
.line.flash { animation: flash 1.6s; }
@keyframes flash { 0%, 40% { background: var(--mark); } }
.ts { color: var(--faint); font: 12px/2 ui-monospace, Menlo, monospace; cursor: pointer; text-align: right; user-select: none; }
.ts:hover { color: var(--accent); }
.who { font-weight: 600; margin-right: 4px; }
.fix { background: var(--ok-soft); border-radius: 3px; padding: 0 2px; cursor: help; }
.pend { background: var(--mark); border-radius: 3px; padding: 0 2px; }

/* 校对 */
.sum { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.sum .big { font-size: 22px; font-weight: 700; margin-right: 2px; }
.h3 { font-size: 15px; font-weight: 700; margin: 22px 0 8px; display: flex; align-items: baseline; gap: 10px; }
.h3 small { font-weight: 400; color: var(--muted); font-size: 12px; }
.h3 .acceptall { font-size: 12px; padding: 3px 10px; align-self: center; }
/* 英文的说明和按键提示比中文长：放不下就整块折到下一行，别把「To confirm」这种标题挤成两行。只管英文页面 */
html[lang="en"] .h3 { flex-wrap: wrap; row-gap: 2px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.card.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.card .ch { font-size: 15px; }
.card .ch del { color: var(--bad); text-decoration-thickness: 1px; }
.card .ch ins { color: var(--ok); text-decoration: none; font-weight: 600; }
.card .why { color: var(--muted); font-size: 13px; grid-column: 1 / 2; }
.card .ctx { color: var(--muted); font-size: 13px; grid-column: 1 / -1; border-top: 1px dashed var(--line); padding-top: 6px; }
.card .acts { display: flex; gap: 6px; grid-row: 1 / 3; grid-column: 2; }
.row { display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; padding: 4px 8px; border-radius: 8px; align-items: baseline; }
.row:hover { background: var(--panel); }
.row .ch del { color: var(--bad); }
.row .ch ins { color: var(--ok); text-decoration: none; }
.row .why { color: var(--muted); font-size: 12px; margin-left: 6px; }
.keys { font-size: 12px; color: var(--muted); }
.keys kbd { font: 11px ui-monospace, Menlo, monospace; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }

/* 分析 */
.md h1 { font-size: 20px; } .md h2 { font-size: 17px; margin-top: 26px; } .md h3 { font-size: 15px; }
.md table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.md blockquote { margin: 8px 0; padding: 4px 14px; border-left: 3px solid var(--line); color: var(--muted); }
.md code { font: 12px ui-monospace, Menlo, monospace; background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
.md pre code { display: block; padding: 10px; overflow-x: auto; }
.tlink { color: var(--accent); cursor: pointer; border-bottom: 1px dotted var(--accent); }

/* 接着问 */
.chat .q { background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; margin: 16px 0 8px auto; max-width: 80%; white-space: pre-wrap; width: fit-content; }
.chat .a { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px; margin-bottom: 8px; }
.ask { display: flex; gap: 8px; margin-top: 16px; position: sticky; bottom: 12px; }
.ask textarea { flex: 1; min-height: 44px; max-height: 160px; resize: vertical; }

/* 拖文件、提示 */
.overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--accent) 18%, transparent); display: none; align-items: center; justify-content: center; z-index: 10; pointer-events: none; }
.overlay.on { display: flex; }
.overlay div { background: var(--panel); border: 2px dashed var(--accent); border-radius: 18px; padding: 28px 40px; font-size: 18px; font-weight: 600; box-shadow: var(--shadow); }
.toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 11; max-width: 440px; }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow); white-space: pre-wrap; font-size: 13px; }
.toast.bad { border-left-color: var(--bad); }
.toast.ok { border-left-color: var(--ok); }
.muted { color: var(--muted); }

@media (max-width: 820px) {
  main { grid-template-columns: 1fr; grid-template-rows: minmax(260px, 42%) 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  header { padding: 8px 12px; } .search { order: 9; width: 100%; margin-left: 0; } .recbtn { padding: 5px 9px; }
  .drop { margin: 8px 10px; padding: 8px; }
  .pane, .dhead { padding-left: 14px; padding-right: 14px; }
}
</style>
</head>
<body>
<header>
  <h1 data-en="Recording Desk">录音台</h1>
  <div class="recbar" id="recbar">
    <button class="recbtn main" data-mode="both" title="线上通话、开会：你的麦克风 + 电脑放出来的声音，两边各存一条轨" data-en="Me + other side" data-en-title="Online calls and meetings: your microphone + the computer's audio, each saved on its own track">我 + 对方</button>
    <button class="recbtn" data-mode="sys" title="只录电脑放出来的声音（网课、视频）。不录你的麦克风" data-en="Computer audio only" data-en-title="Records only the computer's audio (online classes, videos). Not your microphone">只录电脑声音</button>
    <button class="recbtn" data-mode="mic" title="只录麦克风（当面聊）。不录电脑放的声音" data-en="Only me" data-en-title="Records only the microphone (in-person conversations). Not the computer's audio">只录我</button>
    <span class="recnow"><span class="dot"></span><span id="recclock">00:00</span><span id="recmode"></span>
      <span id="meters"></span><button id="stop" data-en="Stop">停止</button></span>
  </div>
  <input class="search" id="search" type="search" placeholder="搜索所有稿子…" data-en-placeholder="Search all transcripts…">
  <span class="login" id="login">Claude …</span>
</header>
<main>
  <aside>
    <!-- 带格式的那几句拆成几个 span，各自有 data-en：app.js 只换 textContent，换整段会把 <b> <br> 冲掉 -->
    <div class="drop"><b data-en="Drag audio files into the window">把音频文件拖进窗口</b><span data-en=" to put them in the inbox for automatic processing">，就放进收件箱自动处理</span><br><span data-en="Transcribe → speakers → Claude proofreading → analysis">转写 → 分人 → Claude 校对 → 分析</span></div>
    <div class="list" id="list"></div>
    <details class="side-sec" id="phonebox"><summary data-en="Recordings on your phone">手机里的录音</summary><div id="phone" class="muted">…</div></details>
    <div class="side-sec"><div class="muted" style="margin-bottom:4px" data-en="Jobs">正在做的事</div><div class="jobs" id="jobs"><span class="muted" data-en="None">没有</span></div></div>
  </aside>
  <section class="detail" id="detail">
    <div class="empty"><span data-en="Select a recording on the left.">左边选一条录音。</span><br>
      <span data-en="Click a timestamp in the transcript to play from there. In Proofreading, press ">看稿子时点时间就从那里放；校对里待确认的，按 </span><kbd>Y</kbd><span data-en=" to accept, "> 采纳、</span><kbd>N</kbd><span data-en=" to reject, "> 不采纳、</span><kbd>J</kbd>/<kbd>K</kbd><span data-en=" to move down/up."> 上下挪。</span></div>
  </section>
</main>
<div class="overlay" id="overlay"><div data-en="Drop to put it in the inbox">松手，放进收件箱</div></div>
<div class="toasts" id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
